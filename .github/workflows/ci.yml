name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端 · 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: server/web
          if-no-files-found: error

  backend:
    name: 后端 · 构建前端 + 格式化检查 / 测试 / 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装前端依赖并构建（web.go 需要 server/web 产物）
        run: |
          npm ci
          npm run build

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 格式化检查
        working-directory: server
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: 单元测试
        working-directory: server
        run: go test ./...

      - name: 静态检查
        working-directory: server
        run: go vet ./...

  docker:
    name: Docker · 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（多阶段，前端现场构建后嵌入）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: findmyclassmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  data:
    name: 数据契约 · 名单 JSON 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 数据边界守卫（真实名单不随仓库分发）
        run: |
          # 真实名单（data/*.json）不进仓库、不进发布包；仓库中不应存在任何名单数据。
          # 数据契约由 server/data_test.go 保证（校内部署放置数据后运行 go test ./... 校验）。
          if ls data/*.json >/dev/null 2>&1; then
            echo "错误：data/ 目录包含名单数据文件，真实名单不得随仓库分发（F42 隐私红线）。" >&2
            exit 1
          fi
          echo "零数据守卫通过：仓库无名单数据文件，数据契约由 server/data_test.go 保证。"