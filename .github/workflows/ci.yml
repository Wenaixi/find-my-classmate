name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端 · 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: server/web
          if-no-files-found: error

  backend:
    name: 后端 · 构建前端 + 格式化检查 / 测试 / 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖并构建（web.go 需要 server/web 产物）
        run: |
          npm ci
          npm run build

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 格式化检查
        working-directory: server
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: 单元测试
        working-directory: server
        run: go test ./...

      - name: 静态检查
        working-directory: server
        run: go vet ./...

  data:
    name: 数据契约 · 名单 JSON 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验名单 JSON 格式、姓名与去重
        run: |
          node -e "
            const fs = require('fs');
            const pick = (entry) => {
              if (typeof entry === 'string') return entry.trim();
              if (entry && typeof entry === 'object' && typeof entry.姓名 === 'string') return entry.姓名.trim();
              return null;
            };
            const extra = (entry) => entry && typeof entry === 'object' ? Object.keys(entry).filter(k => k !== '姓名') : [];
            for (const f of ['data/高一.json', 'data/高二.json']) {
              const obj = JSON.parse(fs.readFileSync(f, 'utf8'));
              const roster = obj.名单;
              if (!roster || typeof roster !== 'object') throw new Error(f + ' 缺少名单对象');
              const grade = f.includes('高一') ? '高一' : '高二';
              const seen = new Set();
              let count = 0;
              for (const [cls, names] of Object.entries(roster)) {
                if (!Array.isArray(names)) throw new Error(f + ' 班级 ' + cls + ' 不是数组');
                for (const entry of names) {
                  const name = pick(entry);
                  if (!name) throw new Error(f + ' 班级 ' + cls + ' 含非法条目: ' + JSON.stringify(entry));
                  const key = grade + '|' + cls + '|' + name;
                  if (seen.has(key)) throw new Error(f + ' 重复记录: ' + key);
                  seen.add(key);
                  count++;
                  const keys = extra(entry);
                  if (keys.length) throw new Error(f + ' 班级 ' + cls + ' 条目含非白名单字段: ' + keys.join(','));
                }
              }
              console.log(f + ': ' + count + ' 条记录，字段干净');
            }
          "
