name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 前端依赖与构建
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 后端测试与静态检查
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...

      - name: 数据契约校验
        run: |
          node -e "
            const fs = require('fs');
            const pick = (entry) => typeof entry === 'string' ? entry.trim() : (entry && typeof entry['姓名'] === 'string' ? entry['姓名'].trim() : null);
            for (const f of ['data/高一.json', 'data/高二.json']) {
              const obj = JSON.parse(fs.readFileSync(f, 'utf8'));
              const roster = obj['名单'];
              const grade = f.includes('高一') ? '高一' : '高二';
              const seen = new Set();
              let count = 0;
              for (const [cls, names] of Object.entries(roster)) {
                for (const entry of names) {
                  const name = pick(entry);
                  if (!name) throw new Error(f + ' 班级 ' + cls + ' 含非法条目');
                  const key = grade + '|' + cls + '|' + name;
                  if (seen.has(key)) throw new Error(f + ' 重复: ' + key);
                  seen.add(key);
                  count++;
                }
              }
              console.log(f + ': ' + count + ' 条记录 OK');
            }
          "

  release:
    name: 构建发布产物
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 交叉编译发布二进制
        working-directory: server
        run: |
          mkdir -p ../release
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../release/findmyclassmate-linux-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../release/findmyclassmate-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../release/findmyclassmate-windows-amd64.exe .

      - name: 归档发布包
        run: |
          mkdir -p release-package
          cp -r server/web release-package/web
          cp -r release/findmyclassmate-* release-package/
          cp -r data release-package/data-sample
          rm -f release-package/data-sample/log/server.log
          cp README.md LICENSE CHANGELOG.md release-package/
          cd release-package && tar -czf ../findmyclassmate.tar.gz .

      - name: 提取更新记录
        run: |
          awk 'BEGIN{found=0} /^## /{if(found)exit; found=1} found{print}' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then echo "未找到当前版本的更新记录。" > release-body.md; fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FindMyClassmate ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            findmyclassmate.tar.gz
            release/findmyclassmate-linux-amd64
            release/findmyclassmate-darwin-arm64
            release/findmyclassmate-windows-amd64.exe
  docker:
    name: 构建并推送 Docker 镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: wenxiloveyou
          password: ${{ secrets.DOCKER_PAT }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wenxiloveyou/find-my-classmate
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

