name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 前端依赖与构建
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 后端测试与静态检查
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...

      - name: 数据契约校验（真实数据不随仓库发布，跳过；校内部署请运行 go test）
        run: echo "数据文件不随仓库分发，数据契约由 server/data_test.go 保证，校内部署时运行 go test ./..."

  release:
    name: 构建发布产物
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 交叉编译发布二进制
        working-directory: server
        run: |
          mkdir -p ../release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o ../release/findmyclassmate-linux-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o ../release/findmyclassmate-darwin-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o ../release/findmyclassmate-windows-amd64.exe .

      - name: 归档发布包
        run: |
          mkdir -p release-package
          cp -r server/web release-package/web
          cp -r release/findmyclassmate-* release-package/
          # 发布包不附带任何名单数据：真实名单仅限校内部署（data/ 不入库），
          # 使用者按 README 的数据格式章节自行准备 data/高一.json 与 data/高二.json
          mkdir -p release-package/data
          cp README.md LICENSE CHANGELOG.md release-package/
          cd release-package && tar -czf ../findmyclassmate.tar.gz .

      - name: 提取更新记录（按当前 tag 精确匹配，找不到则显式失败）
        run: |
          TAG="${{ github.ref_name }}"
          awk -v tag="$TAG" 'BEGIN{found=0} /^## /{if(found){exit} if(index($0, tag)>0){found=1}} found{print}' CHANGELOG.md > release-body.md
          if ! grep -q "$TAG" release-body.md; then
            echo "未找到 CHANGELOG 中对应 ${TAG} 的更新记录，请先在 CHANGELOG.md 顶部追加。" >&2
            exit 1
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FindMyClassmate ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            findmyclassmate.tar.gz
            release/findmyclassmate-linux-amd64
            release/findmyclassmate-darwin-arm64
            release/findmyclassmate-windows-amd64.exe
  docker:
    name: 构建并推送 Docker 镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: wenxiloveyou
          password: ${{ secrets.DOCKER_PAT }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wenxiloveyou/find-my-classmate
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max