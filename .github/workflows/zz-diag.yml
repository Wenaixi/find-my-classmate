name: alloc-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 分配实测（不带 race）
        working-directory: server
        run: |
          mkdir -p web && echo '<html></html>' > web/index.html
          go test -run TestSearchAllocsBudget -v ./... 2>&1 | grep -E "分配次数|FAIL"
      - name: 分配实测（带 race，与 CI 同条件）
        working-directory: server
        run: |
          go test -race -run TestSearchAllocsBudget -v ./... 2>&1 | grep -E "分配次数|FAIL"
